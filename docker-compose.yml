# CVR/FDR Analyzer — docker-compose.yml
# Ports: Frontend 3001, Backend 4001, PostgreSQL 5432, MinIO API 9002, MinIO Console 9003

services:

  db:
    image: postgres:15-alpine
    container_name: cvrfdr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cvrfdr_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: cvrfdr_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - cvrfdr_miniodata:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: cvrfdr_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set cvrfdr http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing cvrfdr/${MINIO_BUCKET} &&
        mc anonymous set none cvrfdr/${MINIO_BUCKET} &&
        echo 'Bucket is ready' &&
        exit 0
      "
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cvrfdr_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
      MINIO_REGION: us-east-1
      PORT: 4000
      NODE_ENV: ${NODE_ENV}
      PYTHON_BIN: /usr/bin/python3
      EMOTION_SCRIPT: /app/python_model/emotion_detection.py
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN}
      HF_TOKEN: ${HF_TOKEN}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
    ports:
      - "4001:4000"
    volumes:
      - ./server:/app/server
      - ./python_model:/app/python_model
      - /app/server/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cvrfdr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:4001
      WDS_SOCKET_PORT: 3001
      REACT_APP_BACKEND_URL: http://cvrfdr_backend:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules

volumes:
  cvrfdr_pgdata:
  cvrfdr_miniodata:
